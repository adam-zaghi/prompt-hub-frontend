<p-card styleClass="address-summary-card h-full">
  <div
    class="cursor-pointer flex flex-column gap-3"
    role="button"
    tabindex="0"
    (click)="openEdit()"
    (keydown.enter)="openEdit()"
  >
    <div class="flex justify-content-between align-items-start gap-3">
      <div class="flex align-items-center gap-3">
        <div class="address-icon">
          <i class="pi pi-map-marker"></i>
        </div>

        <div>
          <h3 class="m-0 text-base">
            {{ address.city || 'Adresse' }}
          </h3>

          <p class="m-0 mt-1 text-sm text-color-secondary">
            {{ address.country }}
          </p>
        </div>
      </div>

      @if (address.isDefault) {
        <p-tag value="Par défaut" severity="success" />
      }
    </div>

    <div>
      <span class="text-sm text-color-secondary">Adresse complète</span>
      <p class="m-0 mt-1 font-medium line-height-3">
        {{ fullAddress }}
      </p>
    </div>

    <div class="grid">
      <div class="col-12 md:col-6">
        <div class="mini-info">
          <span>Latitude</span>
          <strong>{{ address.latitude }}</strong>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="mini-info">
          <span>Longitude</span>
          <strong>{{ address.longitude }}</strong>
        </div>
      </div>
    </div>

    <div class="flex justify-content-end">
      <p-button
        type="button"
        label="Modifier"
        icon="pi pi-pencil"
        size="small"
        [outlined]="true"
        (onClick)="openEdit(); $event.stopPropagation()"
      />
    </div>
  </div>
</p-card>
