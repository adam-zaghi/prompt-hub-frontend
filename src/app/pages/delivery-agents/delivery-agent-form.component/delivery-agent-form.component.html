<div class="p-4">
  <div class="mb-4">
    <h2 class="m-0">Créer un livreur</h2>
    <p class="text-color-secondary mt-2 mb-0">
      Créez un profil livreur à partir d’un utilisateur existant dans Auth Service.
    </p>
  </div>

  <div class="surface-card border-round p-4 shadow-1">
    <div class="grid">

      <div class="col-12 md:col-6">
        <label class="block mb-2 font-medium">Email du user *</label>
        <input
          pInputText
          class="w-full"
          [(ngModel)]="form.userEmail"
          name="userEmail"
          placeholder="Ex: livreur@email.com"
        />
        <small class="text-color-secondary">
          Le user doit déjà exister avec le rôle USER. Il sera converti en DELIVERY_AGENT.
        </small>
      </div>

      <div class="col-12 md:col-6">
        <label class="block mb-2 font-medium">Ville actuelle *</label>
        <input
          pInputText
          class="w-full"
          [(ngModel)]="form.currentCity"
          name="currentCity"
          placeholder="Ex: Casablanca"
        />
      </div>

      <div class="col-12 md:col-6 flex align-items-end">
        <div class="flex align-items-center gap-2">
          <p-checkbox
            [(ngModel)]="form.available"
            name="available"
            [binary]="true"
            inputId="available"
          />
          <label for="available">Disponible</label>
        </div>
      </div>

      <div class="col-12 mt-4 flex gap-2">
        <p-button
          label="Créer le livreur"
          icon="pi pi-check"
          [loading]="loading"
          (onClick)="createAgent()"
        />

        <p-button
          label="Annuler"
          icon="pi pi-times"
          severity="secondary"
          [outlined]="true"
          routerLink="/delivery-agents"
        />
      </div>
    </div>
  </div>
</div>
