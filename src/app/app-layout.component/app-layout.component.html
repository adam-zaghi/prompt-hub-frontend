<div
  class="app-shell min-h-screen surface-ground"
  [style.--sidebar-width]="sidebarCollapsed() ? '5rem' : '17rem'"
>
  <!-- Sidebar desktop -->
  <aside class="app-sidebar desktop-sidebar hidden md:flex fixed top-0 left-0 flex-column h-screen z-5">
    <ng-container
      [ngTemplateOutlet]="sidebarContent"
      [ngTemplateOutletContext]="{
        collapsed: sidebarCollapsed(),
        mobile: false
      }"
    />
  </aside>

  <!-- Contenu principal -->
  <section class="main-column flex flex-column min-h-screen transition-all transition-duration-200">
    <!-- Topbar -->
    <header class="app-topbar sticky top-0 z-4 flex align-items-center justify-content-between">
      <div class="flex align-items-center gap-2">
        <button
          pButton
          type="button"
          icon="pi pi-bars"
          severity="secondary"
          [text]="true"
          [rounded]="true"
          class="md:hidden topbar-icon-button"
          aria-label="Ouvrir le menu"
          (click)="openMobileSidebar()"
        ></button>

        <button
          pButton
          type="button"
          [icon]="sidebarCollapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"
          severity="secondary"
          [text]="true"
          [rounded]="true"
          class="hidden md:inline-flex topbar-icon-button"
          aria-label="Réduire la sidebar"
          (click)="toggleDesktopSidebar()"
        ></button>

        <div class="topbar-title">
          <span>SmartLog</span>
          <strong>Espace de travail</strong>
        </div>
      </div>

      <div class="flex align-items-center gap-1">
        <p-button
          [icon]="isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          severity="secondary"
          size="small"
          [text]="true"
          [rounded]="true"
          aria-label="Changer le thème"
          (onClick)="toggleDarkMode()"
        />

        <p-button
          icon="pi pi-bell"
          severity="secondary"
          size="small"
          [text]="true"
          [rounded]="true"
          aria-label="Notifications"
        />

        <p-button
          icon="pi pi-sign-out"
          severity="danger"
          size="small"
          [text]="true"
          [rounded]="true"
          aria-label="Se déconnecter"
          (onClick)="logout()"
          routerLink="/auth"
        />
      </div>
    </header>

    <!-- Pages enfants -->
    <main class="app-main flex-1 overflow-auto">
      <div class="app-page-container">
        <router-outlet />
      </div>
    </main>
  </section>
</div>

<!-- Sidebar mobile -->
<p-drawer
  [(visible)]="mobileSidebarVisible"
  position="left"
  header="SmartLog"
  [style]="{ width: '18rem' }"
>
  <ng-container
    [ngTemplateOutlet]="sidebarContent"
    [ngTemplateOutletContext]="{
      collapsed: false,
      mobile: true
    }"
  />
</p-drawer>

<!-- Template sidebar partagé -->
<ng-template
  #sidebarContent
  let-collapsed="collapsed"
  let-mobile="mobile"
>
  <div class="sidebar-inner flex flex-column h-full">
    <!-- Logo -->
    @if (!mobile) {
      <div
        class="sidebar-brand"
        [class.sidebar-brand-collapsed]="collapsed"
      >
        <a
          [routerLink]="homeLink"
          class="brand-link no-underline text-color"
          [class.justify-content-center]="collapsed"
          aria-label="Aller à l'accueil"
        >
          <div class="brand-logo">
            <img
              ngSrc="/package-location-icon-free-vector.jpg"
              alt="Logo SmartLog"
              width="32"
              height="32"
            />
          </div>

          @if (!collapsed) {
            <div class="brand-text">
              <strong>SmartLog</strong>
              <span>Workspace</span>
            </div>
          }
        </a>
      </div>
    }

    <!-- Navigation -->
    <nav class="sidebar-nav flex-1 overflow-y-auto overflow-x-hidden">
      @for (group of navGroups; track group.label) {
        <section class="nav-group">
          @if (!collapsed) {
            <p class="nav-group-label">
              {{ group.label }}
            </p>
          }

          <div class="flex flex-column gap-1">
            @for (item of group.items; track item.route) {

              <a
                class="nav-link"
                [class.nav-link-collapsed]="collapsed"
                [routerLink]="item.route"

                routerLinkActive="nav-link-active"

                [routerLinkActiveOptions]="{
        exact: item.exact ?? true
      }"

                ariaCurrentWhenActive="page"

                [title]="collapsed ? item.label : ''"

                (click)="mobile && closeMobileSidebar()"
              >
      <span class="nav-icon">
        <i [class]="item.icon"></i>
      </span>

                @if (!collapsed) {
                  <span class="nav-label">
          {{ item.label }}
        </span>

                  @if (item.badge) {
                    <span class="nav-badge">
            {{ item.badge }}
          </span>
                  }
                }
              </a>

            }
          </div>
        </section>
      }
    </nav>

    <!-- Profil utilisateur -->
    <div class="sidebar-profile">
      <button
        type="button"
        class="profile-button"
        [class.profile-button-collapsed]="collapsed"
        [title]="collapsed ? authService.currentUser()?.email || 'Utilisateur' : ''"
      >
        <p-avatar
          [label]="getUserInitials()"
          shape="circle"
          size="normal"
          class="flex-shrink-0"
        />

        @if (!collapsed) {
          <span class="profile-text">
            <strong>
              {{ authService.currentUser()?.email }}
            </strong>

            <small>
              {{ authService.currentUser()?.role }}
            </small>
          </span>

          <i class="pi pi-ellipsis-v profile-more"></i>
        }
      </button>
    </div>
  </div>
</ng-template>
